name: Release Parallel Build

on:
  push:
    branches:
      - release
    paths:
      - "**.py"
      - "requirements*.txt"
      - "build_app.py"
      - "bootstrap_build.py"
      - "build_release.sh"
      - "build_release.ps1"
      - ".github/workflows/cross-platform-build.yml"
      - "node_editor_app.py"
      - "gui/**"
      - "integration/**"
      - "config/**"
      - "playright/**"
      - "login/**"
      - "utils/**"
      - "build_hooks/**"
      - "tools/**"
      - "icon.icns"
      - "icon.ico"
      - "icon.iconset/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: windows-x64
            artifact_name: windows-x64
            package_dir: installer/windows-x64
            dist_dir: dist/windows-x64
            package_script: |
              $packageDir = "installer\windows-x64"
              New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
              $packagePath = Join-Path $packageDir "DP采集器-Windows-x64-${env:GITHUB_SHA}.zip"
              if (Test-Path $packagePath) { Remove-Item $packagePath }
              Compress-Archive -Path "dist\windows-x64\*" -DestinationPath $packagePath
          - name: macOS x86_64
            runner: macos-15-intel
            target: macos-x86_64
            artifact_name: macos-x86_64
            package_dir: installer/macos-x86_64
            dist_dir: dist/macos-x86_64
            package_script: |
              PACKAGE_DIR="installer/macos-x86_64"
              mkdir -p "$PACKAGE_DIR"
              PACKAGE_PATH="$PACKAGE_DIR/DP采集器-macOS-x86_64-${GITHUB_SHA}.dmg"
              if command -v create-dmg >/dev/null 2>&1; then
                create-dmg \
                  --volname "DP采集器-Intel" \
                  --window-pos 200 120 \
                  --window-size 640 420 \
                  --app-drop-link 440 200 \
                  "$PACKAGE_PATH" \
                  "dist/macos-x86_64/DP采集器.app"
              else
                hdiutil create \
                  -volname "DP采集器-Intel" \
                  -srcfolder "dist/macos-x86_64/DP采集器.app" \
                  -ov -format UDZO \
                  "$PACKAGE_PATH"
              fi
          - name: macOS arm64
            runner: macos-latest
            target: macos-arm64
            artifact_name: macos-arm64
            package_dir: installer/macos-arm64
            dist_dir: dist/macos-arm64
            package_script: |
              PACKAGE_DIR="installer/macos-arm64"
              mkdir -p "$PACKAGE_DIR"
              PACKAGE_PATH="$PACKAGE_DIR/DP采集器-macOS-arm64-${GITHUB_SHA}.dmg"
              if command -v create-dmg >/dev/null 2>&1; then
                create-dmg \
                  --volname "DP采集器-Silicon" \
                  --window-pos 200 120 \
                  --window-size 640 420 \
                  --app-drop-link 440 200 \
                  "$PACKAGE_PATH" \
                  "dist/macos-arm64/DP采集器.app"
              else
                hdiutil create \
                  -volname "DP采集器-Silicon" \
                  -srcfolder "dist/macos-arm64/DP采集器.app" \
                  -ov -format UDZO \
                  "$PACKAGE_PATH"
              fi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show Python Version
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          python --version

      - name: Install Dependencies
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build App
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          python build_app.py --target ${{ matrix.target }} --skip-installer

      - name: Install create-dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v create-dmg >/dev/null 2>&1; then
            brew install create-dmg
          fi

      - name: Package Artifact
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: ${{ matrix.package_script }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.dist_dir }}/**
            ${{ matrix.package_dir }}/**
          retention-days: 30

  package-all:
    name: Aggregate Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages

      - name: Show Package Tree
        run: |
          find release-packages -maxdepth 3 -type f | sort

      - name: Upload Aggregated Packages
        uses: actions/upload-artifact@v4
        with:
          name: all-platform-packages
          path: release-packages/**
          retention-days: 30
