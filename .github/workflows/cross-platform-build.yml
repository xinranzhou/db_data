# GitHub Actions 跨平台构建配置
# 触发条件: merge到release分支 或 创建v*版本标签

name: Cross-Platform Build

on:
  push:
    branches:
      - release
    tags:
      - v*
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'build_app.py'
      - '.github/workflows/*.yml'
      - 'node_editor_app.py'
      - 'gui/capture/**'
      - 'integration/**'
      - 'config/**'
  pull_request:
    branches:
      - release

jobs:
  # Windows x64 构建
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 构建Windows x64
        run: |
          python build_app.py --target windows-x64 --skip-installer

      - name: 创建安装包
        run: |
          $outputPath = "installer\windows-x64\DP采集器-Windows-x64.zip"
          if (Test-Path $outputPath) { Remove-Item $outputPath }
          Compress-Archive -Path "dist\windows-x64\*" -DestinationPath $outputPath

      - name: 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: windows-x64
          path: |
            installer/windows-x64/*.zip
            dist/windows-x64/**
          retention-days: 30

  # Windows x86 构建
  build-windows-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 构建Windows x86
        run: |
          python build_app.py --target windows-x86 --skip-installer

      - name: 创建安装包
        run: |
          $outputPath = "installer\windows-x86\DP采集器-Windows-x86.zip"
          if (Test-Path $outputPath) { Remove-Item $outputPath }
          Compress-Archive -Path "dist\windows-x86\*" -DestinationPath $outputPath

      - name: 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: windows-x86
          path: |
            installer/windows-x86/*.zip
            dist/windows-x86/**
          retention-days: 30

  # macOS Intel 构建
  build-macos-intel:
    runs-on: macos-latest
    steps:
      - name: Checkout代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: 构建macOS Intel
        run: |
          python3 build_app.py --target macos-x86_64 --skip-installer

      - name: 安装create-dmg
        run: |
          brew install create-dmg

      - name: 创建DMG
        run: |
          create-dmg \
            --volname "DP采集器-Intel" \
            --window-pos 200 120 \
            --window-size 640 420 \
            --app-drop-link 440 200 \
            "installer/macos-x86_64/DP采集器-macOS-Intel.dmg" \
            "dist/macos-x86_64/DP采集器.app"

      - name: 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: macos-intel
          path: |
            installer/macos-x86_64/*.dmg
            dist/macos-x86_64/**
          retention-days: 30

  # macOS Silicon 构建
  build-macos-silicon:
    runs-on: macos-latest
    steps:
      - name: Checkout代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: 构建macOS Silicon
        run: |
          python3 build_app.py --target macos-arm64 --skip-installer

      - name: 安装create-dmg
        run: |
          brew install create-dmg

      - name: 创建DMG
        run: |
          create-dmg \
            --volname "DP采集器-Silicon" \
            --window-pos 200 120 \
            --window-size 640 420 \
            --app-drop-link 440 200 \
            "installer/macos-arm64/DP采集器-macOS-Silicon.dmg" \
            "dist/macos-arm64/DP采集器.app"

      - name: 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: macos-silicon
          path: |
            installer/macos-arm64/*.dmg
            dist/macos-arm64/**
          retention-days: 30

  # Release发布（仅在tag推送时）
  release:
    needs: [build-windows-x64, build-windows-x86, build-macos-intel, build-macos-silicon]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: List artifacts
        run: |
          ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-x64/*.zip
            artifacts/windows-x86/*.zip
            artifacts/macos-intel/*.dmg
            artifacts/macos-silicon/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
